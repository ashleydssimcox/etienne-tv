# One-off helper: lists the active Experiences rows (name and section) so photos can be matched to them.
# Uses the public publishable key, the same one the TV page uses.
name: List experiences
on:
  push:
    paths: ['.github/workflows/list-experiences.yml']
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          k=sb_publishable_ZWA3j-rd5XZrBbU5BbpeSg_3T0ck-f7
          mkdir -p tools
          curl -fsS "https://cxryccvdunfmhyhlrfyf.supabase.co/rest/v1/menu_items?select=name,subcategory,description,image_url,sort_order&category=eq.experiences&active=eq.true&order=sort_order.asc" \
            -H "apikey: $k" -H "Authorization: Bearer $k" > tools/experiences.json
          cat tools/experiences.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/experiences.json
          git diff --cached --quiet || git commit -m "List of active experiences"
          git push
