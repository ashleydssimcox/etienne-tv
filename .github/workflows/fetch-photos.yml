# Downloads the stock photos used on the Experience cards into web/img, so the TV loads them from GitHub Pages
# (the same place as the rest of the page) instead of from Unsplash, which the 2017 Samsung would not load.
# Runs when this file changes, or by hand from the Actions tab.
name: Fetch stock photos
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p web/img
          q='?fm=jpg&q=72&w=900&fit=crop'
          get() { curl -fsSL -o "web/img/$1.jpg" "https://images.unsplash.com/photo-$2$q"; }
          get exp-chef      1695641738244-25e5355e9a42
          get exp-cooking   1521633138793-76551d05e2a3
          get exp-picnic    1683914791864-b32fe9c45029
          get exp-massage   1600334089648-b0d9d3028eb2
          get exp-sunset    1608480176234-c3fdfe59e988
          get exp-island    1740688244365-e339951acc16
          get exp-transfers 1471174617910-3e9c04f58ff5
          ls -l web/img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img
          git diff --cached --quiet || git commit -m "Stock photos for the Experience cards"
          git push
