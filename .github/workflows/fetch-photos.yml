# Downloads the stock photos used on the Experience cards into web/img, so the TV loads them from GitHub Pages
# (the same place as the rest of the page) instead of from Unsplash, which the 2017 Samsung would not load.
# Runs when this file changes, or by hand from the Actions tab.
name: Fetch stock photos
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p web/img
          q='?fm=jpg&q=72&w=900&fit=crop'
          curl -fsSL -o web/img/exp-dining.jpg    "https://images.unsplash.com/photo-1695641738244-25e5355e9a42$q"
          curl -fsSL -o web/img/exp-wellness.jpg  "https://images.unsplash.com/photo-1650044252595-cacd425982ff$q"
          curl -fsSL -o web/img/exp-water.jpg     "https://images.unsplash.com/photo-1740688244365-e339951acc16$q"
          curl -fsSL -o web/img/exp-transfers.jpg "https://images.unsplash.com/photo-1471174617910-3e9c04f58ff5$q"
          ls -l web/img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img
          git diff --cached --quiet || git commit -m "Stock photos for the Experience cards"
          git push
