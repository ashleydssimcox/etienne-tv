# Downloads single-colour app logos (Simple Icons, simpleicons.org) into web/img/logos, recoloured to the
# villa's champagne tone, for the Streaming tiles. A logo that is not in the library is skipped and the
# tile shows the app name instead. Runs when this file changes, or by hand from the Actions tab.
name: Fetch app logos
on:
  push:
    paths: ['.github/workflows/fetch-logos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p web/img/logos
          for pair in netflix:netflix youtube:youtube disney:disneyplus prime:primevideo max:hbomax max:max spotify:spotify; do
            key=${pair%%:*}; slug=${pair##*:}
            [ -s web/img/logos/$key.svg ] && continue
            if curl -fsSL -o /tmp/l.svg "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/$slug.svg"; then
              sed 's/<svg /<svg fill="#e9dcc4" /' /tmp/l.svg > web/img/logos/$key.svg
              echo "got $key from $slug"
            else
              echo "missing $slug"
            fi
          done
          ls -l web/img/logos
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/img/logos
          git diff --cached --quiet || git commit -m "App logos for the Streaming tiles"
          git push
