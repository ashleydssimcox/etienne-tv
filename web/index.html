<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>The Étienne</title>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <div id="toast"></div>
</div>
<script>
/* Starter page. It never needs changing: it loads the newest interface files from GitHub Pages every time,
   and uses the copies packed with this page only if GitHub Pages can't be reached. */
(function () {
  var LIVE = 'https://ashleydssimcox.github.io/etienne-tv/web/';
  var t = '?t=' + new Date().getTime();
  var files = ['config.js', 'platform.js', 'app.js'];
  function css(base) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = base + 'styles.css' + t;
    document.head.appendChild(l);
  }
  function load(base, i, onFail) {
    if (i >= files.length) return;
    var s = document.createElement('script');
    s.src = base + files[i] + t;
    s.onload = function () { load(base, i + 1, onFail); };
    s.onerror = function () { if (i === 0 && onFail) onFail(); };
    document.body.appendChild(s);
  }
  css(LIVE);
  load(LIVE, 0, function () { css(''); load('', 0, null); });
})();
</script>
</body>
</html>
